<!-- main nav -->
<nav *ngIf="account" class="navbar">
    <div class="container">
        <div class="nav-flex">
            <div class="navbar-brand">
                <strong>Angular Auth</strong>
            </div>
            <div class="navbar-nav">
                <a routerLink="/">Home</a>
                <a routerLink="/profile">Profile</a>
                <a *ngIf="account.role === 'Admin'" routerLink="/admin">Admin</a>
                <button class="btn btn-link logout-btn" (click)="logout()">Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- subnav outlet -->
<router-outlet name="subnav"></router-outlet>

<!-- alert component -->
<alert></alert>

<!-- main outlet -->
<div class="main-content">
    <router-outlet></router-outlet>
</div>
