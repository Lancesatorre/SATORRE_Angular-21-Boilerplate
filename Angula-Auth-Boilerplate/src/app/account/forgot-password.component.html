<h3 class="card-header">Forgot Password</h3>
<div class="card-body">
    <p class="text-muted" style="margin-bottom: 1.5rem;">Enter your email address and we'll send you instructions to
        reset your password.</p>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f.email.errors }" placeholder="Enter your email" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">Email is required</div>
                <div *ngIf="f.email.errors.email">Email is invalid</div>
            </div>
        </div>
        <div class="mb-3">
            <button [disabled]="loading" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                <span *ngIf="!loading">Send Reset Link</span>
                <span *ngIf="loading">Sending...</span>
            </button>
        </div>
        <div style="text-align: center;">
            <a routerLink="../login" class="btn btn-link">Back to Login</a>
        </div>
    </form>
</div>
