<h3 class="card-header">Verify Email</h3>
<div class="card-body">
    <div *ngIf="emailStatus == EmailStatus.Verifying" class="alert alert-info">
        <p style="text-align: center;">Verifying your email address...</p>
    </div>
    <div *ngIf="emailStatus == EmailStatus.Failed" class="alert alert-danger">
        <p><strong>Verification Failed</strong></p>
        <p>Verification failed. You can try registering again or contact support.</p>
    </div>
</div>
