<h3 class="card-header">Login</h3>
<div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" formControlName="email" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f.email.errors }" placeholder="Enter your email" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">Email is required</div>
                <div *ngIf="f.email.errors.email">Email is invalid</div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" formControlName="password" class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f.password.errors }" placeholder="Enter your password" />
            <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                <div *ngIf="f.password.errors.required">Password is required</div>
            </div>
        </div>
        <div class="mb-3">
            <button [disabled]="submitting" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                <span *ngIf="!submitting">Login</span>
                <span *ngIf="submitting">Logging in...</span>
            </button>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: space-between; flex-wrap: wrap;">
            <a routerLink="../register" class="btn btn-link">Create Account</a>
            <a routerLink="../forgot-password" class="btn btn-link">Forgot Password?</a>
        </div>
    </form>
</div>
