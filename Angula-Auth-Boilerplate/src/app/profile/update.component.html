<div class="card">
    <h3 class="card-header">Update Profile</h3>
    <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col" style="flex: 0 0 20%;">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <select formControlName="title" class="form-control"
                            [ngClass]="{'is-invalid': submitted && f.title.errors }">
                            <option value="">Select</option>
                            <option value="Mr">Mr</option>
                            <option value="Mrs">Mrs</option>
                            <option value="Miss">Miss</option>
                            <option value="Ms">Ms</option>
                        </select>
                        <div *ngIf="submitted && f.title.errors" class="invalid-feedback">
                            <div *ngIf="f.title.errors.required">Title is required</div>
                        </div>
                    </div>
                </div>
                <div class="col" style="flex: 0 0 40%;">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" formControlName="firstName" class="form-control"
                            [ngClass]="{'is-invalid': submitted && f.firstName.errors }" placeholder="First name">
                        <div *ngIf="submitted && f.firstName.errors" class="invalid-feedback">
                            <div *ngIf="f.firstName.errors.required">First Name is required</div>
                        </div>
                    </div>
                </div>
                <div class="col" style="flex: 0 0 40%;">
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" formControlName="lastName" class="form-control"
                            [ngClass]="{'is-invalid': submitted && f.lastName.errors }" placeholder="Last name">
                        <div *ngIf="submitted && f.lastName.errors" class="invalid-feedback">
                            <div *ngIf="f.lastName.errors.required">Last Name is required</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" formControlName="email" class="form-control"
                    [ngClass]="{'is-invalid': submitted && f.email.errors }" placeholder="Email address">
                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                    <div *ngIf="f.email.errors.required">Email is required</div>
                    <div *ngIf="f.email.errors.email">Email must be a valid email address</div>
                </div>
            </div>
            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
                <h4 style="margin-bottom: 0.5rem;">Change Password</h4>
                <p class="text-muted" style="margin-bottom: 1rem;">Leave blank to keep the current password</p>
            </div>
            <div class="row">
                <div class="col" style="flex: 0 0 50%;">
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" formControlName="password" class="form-control"
                            [ngClass]="{'is-invalid': submitted && f.password.errors }" placeholder="Min 6 characters">
                        <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                            <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
                        </div>
                    </div>
                </div>
                <div class="col" style="flex: 0 0 50%;">
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" formControlName="confirmPassword" class="form-control"
                            [ngClass]="{'is-invalid': submitted && f.confirmPassword.errors }"
                            placeholder="Confirm password">
                        <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback">
                            <div *ngIf="f.confirmPassword.errors.mustMatch">Passwords must match</div>
                        </div>
                    </div>
                </div>
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <button type="submit" [disabled]="submitting" class="btn btn-primary">
                    <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                    <span *ngIf="!submitting">Update Profile</span>
                    <span *ngIf="submitting">Updating...</span>
                </button>
                <button type="button" (click)="onDelete()" [disabled]="deleting" class="btn btn-danger">
                    <span *ngIf="deleting" class="spinner-border spinner-border-sm me-1"></span>
                    <span *ngIf="!deleting">Delete Account</span>
                    <span *ngIf="deleting">Deleting...</span>
                </button>
                <a routerLink="../" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
